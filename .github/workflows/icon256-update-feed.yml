name: Publish Icon256 update feed
on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: icon256-update-feed
  cancel-in-progress: false
jobs:
  publish-feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feed builder
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Checkout disposable feed worktree
        uses: actions/checkout@v4
        with:
          ref: main
          path: feed
      - name: Set feed commit identity
        working-directory: feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Mirror and verify only published release assets
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 source/tools/icon256_update_feed.py --repository "$RELEASE_REPOSITORY" --checkout feed
