name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build as a draft
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: icon256-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-firmware:
    name: Build and verify Icon256 release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set the build version from the validated tag
        id: version
        run: python tools/icon256_release.py prepare --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.buildcache
          key: ${{ runner.os }}-icon256-pio-${{ hashFiles('**/platformio*.ini', 'requirements.txt', 'boards/**', 'usermods/**/library.json') }}

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Test release packaging
        run: python -m unittest discover -s test/icon256_release -v

      - name: Build Web UI
        run: npm run build
        timeout-minutes: 2

      - name: Run web and word-clock tests
        run: |
          npm test
          python test/icon256_wordclock/test_german.py
        timeout-minutes: 3

      - name: Build Icon256 firmware
        run: pio run -e icon256
        timeout-minutes: 30

      - name: Validate firmware and generate manifest
        run: |
          python tools/icon256_release.py package \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" \
            --firmware .pio/build/icon256/firmware.bin --out release-artifacts

      - name: Upload verified draft assets
        uses: actions/upload-artifact@v4
        with:
          name: icon256-release
          path: release-artifacts/*
          if-no-files-found: error

  create-draft:
    name: Create draft for human review
    needs: build-firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release validation script
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Download verified assets
        uses: actions/download-artifact@v4
        with:
          name: icon256-release
          path: release-artifacts

      - name: Verify downloaded firmware against manifest
        run: python3 tools/icon256_release.py verify release-artifacts/manifest.json

      - name: Create draft release without changing update channels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ needs.build-firmware.outputs.prerelease }}
        run: |
          args=(--draft --verify-tag --title "Icon256 ${RELEASE_TAG#v}" --notes-file release-artifacts/release-notes.md)
          if [[ "$IS_PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}" \
            release-artifacts/*.bin release-artifacts/manifest.json release-artifacts/SHA256SUMS
# AI: end
