; Icon256 build targets shared by local builds and release CI.
[env:icon256]
;; ESP32-S3, with 4MB FLASH and <= 4MB PSRAM (memory_type: qio_qspi)
;; Hardware defaults for the Icon256 fork.
board = lolin_s3_mini ;; -S3 mini, 4MB flash 2MB PSRAM 
platform = ${esp32s3.platform}
upload_speed = 921600
custom_usermods = icon256_wordclock audioreactive_v1 usermod_v2_selftest
build_unflags = 
  ${esp32s3.build_unflags}
  -D WLED_ENABLE_DMX
  -D WLED_ENABLE_DMX_INPUT
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32_S3_Icon256\"
  -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1      ;; for boards with USB-OTG connector only (USBCDC or "TinyUSB")
  -DBOARD_HAS_PSRAM
  -DLOLIN_WIFI_FIX ; seems to work much better with this
  -D WLED_WATCHDOG_TIMEOUT=0
  -D DATA_PINS=37
  -D PIXEL_COUNTS=256
  -D AUDIOPIN=-1
  -D DMTYPE=4     # 0-analog/disabled, 1-I2S generic, 2-ES7243, 3-SPH0645, 4-I2S+mclk, 5-I2S PDM
  -D I2S_SDPIN=6
  -D I2S_WSPIN=4
  -D I2S_CKPIN=7
  -D WLED_NTP_SERVER=\"162.159.200.1\"
lib_deps = ${esp32s3.lib_deps}
lib_ignore = ${esp32s3.lib_ignore}
board_build.partitions = ${esp32.default_partitions}
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_filters = esp32_exception_decoder

